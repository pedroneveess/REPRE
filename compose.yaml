services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/var/www

    environment:
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: tcc_banco_de_dados
      DB_USERNAME: repre_user
      DB_PASSWORD: repre_senha
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

    networks:
      - tcc_network

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "php", "artisan", "up"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16
    container_name: repre_postgres

    environment:
      POSTGRES_DB: tcc_banco_de_dados
      POSTGRES_USER: repre_user
      POSTGRES_PASSWORD: repre_senha

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - tcc_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repre_user -d tcc_banco_de_dados"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - /app/node_modules

    environment:
      VITE_API_URL: http://localhost:8000

    networks:
      - tcc_network

    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  tcc_network: