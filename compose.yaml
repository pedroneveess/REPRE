services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/var/www

    networks:
      - tcc_network

  postgres:
    image: postgres:16
    container_name: repre_postgres

    environment:
      POSTGRES_DB: tcc_banco_de_dados
      POSTGRES_USER: repre_user
      POSTGRES_PASSWORD: repre_senha

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - tcc_network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repre_user -d tcc_banco_de_dados"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:

networks:
  tcc_network: